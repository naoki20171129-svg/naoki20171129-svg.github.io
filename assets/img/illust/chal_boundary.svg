<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-label="Cell walls are faint, so even two experts draw slightly different boundaries">
  <rect width="160" height="120" rx="16" fill="#f3f6f4"/>
  <!-- two touching cells with a faint shared wall -->
  <rect x="20" y="22" width="120" height="70" rx="20" fill="#d5dbe0"/>
  <path d="M80 22 C76 44 86 66 80 92" stroke="#c2c9cf" stroke-width="5" fill="none"/>
  <g fill="#eef1f3"><circle cx="46" cy="44" r="5"/><circle cx="56" cy="62" r="6"/><circle cx="40" cy="70" r="4"/><circle cx="108" cy="42" r="5"/><circle cx="116" cy="62" r="6"/><circle cx="102" cy="72" r="4"/></g>
  <!-- annotator 1 and annotator 2 boundaries -->
  <path d="M74 22 C70 46 80 66 74 92" stroke="#6d93c4" stroke-width="3" fill="none" stroke-dasharray="7 4"/>
  <path d="M86 22 C82 44 92 66 86 92" stroke="#e07a5f" stroke-width="3" fill="none" stroke-dasharray="7 4"/>
  <!-- small people icons -->
  <g transform="translate(46 98)"><circle cx="6" cy="5" r="4.5" fill="#6d93c4"/><path d="M-1 16 C-1 9 13 9 13 16 Z" fill="#6d93c4"/></g>
  <g transform="translate(102 98)"><circle cx="6" cy="5" r="4.5" fill="#e07a5f"/><path d="M-1 16 C-1 9 13 9 13 16 Z" fill="#e07a5f"/></g>
  <!-- double arrow showing the gap -->
  <path d="M74 104 L86 104" stroke="#3a4652" stroke-width="2"/><path d="M77 101 L74 104 L77 107 M83 101 L86 104 L83 107" stroke="#3a4652" stroke-width="2" fill="none"/>
</svg>
