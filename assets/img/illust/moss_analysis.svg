    <path d="M24 26 C26 60 22 90 28 124"/><path d="M38 26 C40 56 46 92 42 124"/><path d="M52 26 C50 64 58 96 54 124"/>
    <path d="M66 26 C64 60 70 88 76 124"/><path d="M30 40 C40 60 50 70 62 110"/><path d="M72 36 C60 60 48 82 34 112"/>
  </g>
  <g fill="#9aa7b3" opacity="0.7"><circle cx="20" cy="70" r="1.6"/><circle cx="78" cy="84" r="1.6"/><circle cx="46" cy="40" r="1.4"/><circle cx="60" cy="118" r="1.4"/></g>
  <!-- arrow -->
