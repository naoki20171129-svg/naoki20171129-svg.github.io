  <path d="M174 62 A36 36 0 0 1 162 58" fill="none" stroke="#3a4652" stroke-width="2"/>
  <!-- ruler -->
  <g transform="translate(116 132)">
    <rect x="0" y="0" width="70" height="9" rx="2" fill="#f2c46d" stroke="#3a4652" stroke-width="1.4"/>
