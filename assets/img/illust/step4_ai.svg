  <g stroke="#9aa7b3" stroke-width="1.6">
    <line x1="52" y1="40" x2="100" y2="30"/><line x1="52" y1="40" x2="100" y2="62"/><line x1="52" y1="40" x2="100" y2="94"/>
    <line x1="52" y1="75" x2="100" y2="30"/><line x1="52" y1="75" x2="100" y2="62"/><line x1="52" y1="75" x2="100" y2="94"/><line x1="52" y1="75" x2="100" y2="124"/>
    <line x1="52" y1="110" x2="100" y2="62"/><line x1="52" y1="110" x2="100" y2="94"/><line x1="52" y1="110" x2="100" y2="124"/>
    <line x1="100" y1="30" x2="148" y2="56"/><line x1="100" y1="62" x2="148" y2="56"/><line x1="100" y1="94" x2="148" y2="56"/>
