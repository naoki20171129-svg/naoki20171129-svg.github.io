<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Synchrotron X-ray micro-CT">
  <defs>
    <marker id="rot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/>
    </marker>
  </defs>
  <rect width="200" height="150" rx="18" fill="#f3f6f4"/>
  <!-- X-ray beam -->
  <polygon points="12,62 150,40 150,104 12,82" fill="#ffd25e" opacity="0.55"/>
  <g stroke="#f2b632" stroke-width="2" opacity="0.8">
    <line x1="14" y1="66" x2="148" y2="50"/><line x1="14" y1="72" x2="148" y2="72"/><line x1="14" y1="78" x2="148" y2="94"/>
  </g>
  <!-- sample on rotating stage -->
  <rect x="86" y="106" width="28" height="9" rx="2" fill="#5b6b7a"/>
  <rect x="97" y="88" width="6" height="18" fill="#5b6b7a"/>
  <ellipse cx="100" cy="76" rx="15" ry="11" fill="#c99a6b" stroke="#8a6040" stroke-width="2"/>
  <ellipse cx="100" cy="76" rx="11" ry="7.5" fill="#f1e3cc"/>
  <path d="M78 124 A26 7 0 0 0 122 124" fill="none" stroke="#e07a5f" stroke-width="3" marker-end="url(#rot)"/>
  <!-- detector -->
  <rect x="150" y="30" width="16" height="86" rx="3" fill="#3a4652"/>
  <g fill="#8fb3e0">
    <rect x="153" y="36" width="10" height="10" rx="1"/><rect x="153" y="50" width="10" height="10" rx="1"/><rect x="153" y="64" width="10" height="10" rx="1"/>
    <rect x="153" y="78" width="10" height="10" rx="1"/><rect x="153" y="92" width="10" height="10" rx="1"/>
  </g>
  <!-- synchrotron hint -->
  <path d="M10 28 A40 40 0 0 1 50 14" fill="none" stroke="#5b6b7a" stroke-width="3" stroke-linecap="round"/>
  <path d="M10 40 A52 52 0 0 1 62 16" fill="none" stroke="#9aa7b3" stroke-width="3" stroke-linecap="round"/>
</svg>
