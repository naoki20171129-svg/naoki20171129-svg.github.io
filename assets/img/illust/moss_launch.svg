<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Moss launched to the space station">
  <rect width="200" height="150" rx="18" fill="#f3f6f4"/>
  <!-- stars -->
  <g fill="#c5cdd4"><circle cx="30" cy="22" r="2"/><circle cx="62" cy="40" r="1.6"/><circle cx="104" cy="16" r="1.8"/><circle cx="172" cy="62" r="1.6"/><circle cx="20" cy="70" r="1.4"/></g>
  <!-- Earth -->
  <path d="M0 150 L0 128 C50 110 150 110 200 128 L200 150 Z" fill="#8fb3e0"/>
  <path d="M30 124 C44 118 60 120 70 126 C60 130 40 130 30 124 Z" fill="#7cc6a4"/>
  <path d="M128 122 C142 116 160 118 170 124 C158 128 140 128 128 122 Z" fill="#7cc6a4"/>
  <!-- rocket trajectory -->
  <path d="M70 118 C80 90 100 66 128 46" fill="none" stroke="#9aa7b3" stroke-width="2.5" stroke-dasharray="5 5"/>
  <!-- rocket -->
  <g transform="translate(66 92) rotate(35)">
    <path d="M0 -24 C8 -14 9 0 7 12 L-7 12 C-9 0 -8 -14 0 -24 Z" fill="#ffffff" stroke="#3a4652" stroke-width="2"/>
    <circle cx="0" cy="-6" r="3.5" fill="#8fb3e0" stroke="#3a4652" stroke-width="1.5"/>
    <path d="M-7 4 L-13 14 L-7 12 Z M7 4 L13 14 L7 12 Z" fill="#e07a5f" stroke="#3a4652" stroke-width="1.5"/>
    <path d="M-4 13 L0 24 L4 13 Z" fill="#f2c46d"/>
  </g>
  <!-- space station -->
  <g transform="translate(148 40)">
    <rect x="-34" y="-4" width="22" height="9" fill="#6d93c4" stroke="#3a4652" stroke-width="1.5"/>
    <rect x="12" y="-4" width="22" height="9" fill="#6d93c4" stroke="#3a4652" stroke-width="1.5"/>
    <rect x="-12" y="-9" width="24" height="18" rx="4" fill="#ffffff" stroke="#3a4652" stroke-width="2"/>
    <!-- moss inside -->
    <path d="M-5 5 C-6 -1 -2 -4 0 -6 C2 -4 6 -1 5 5 Z" fill="#7cc6a4" stroke="#3f8a5f" stroke-width="1.2"/>
  </g>
  <!-- moss badge -->
  <g transform="translate(150 98)">
    <circle r="20" fill="#ffffff" stroke="#3a4652" stroke-width="2"/>
    <rect x="-9" y="4" width="18" height="10" rx="2" fill="#c99a6b"/>
    <path d="M0 4 C-2 -4 -8 -8 -12 -6 C-8 -2 -4 2 0 4 Z" fill="#7cc6a4"/>
    <path d="M0 4 C2 -6 8 -10 12 -8 C8 -2 4 2 0 4 Z" fill="#a8d8c0"/>
    <path d="M0 4 L0 -10" stroke="#3f8a5f" stroke-width="2"/>
  </g>
</svg>
